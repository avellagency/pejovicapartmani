<!DOCTYPE html>
<html lang="sr-Latn-ME">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<title>Galerija fotografija | Pejović apartmani Mojkovac</title>
<meta name="description" content="Fotografije apartmana, kuhinje, spavaće sobe, kupatila i bašte – Pejović apartmani u Mojkovcu, Crna Gora.">
<link rel="canonical" href="https://pejovic-apartmani.github.io/galerija.html">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="theme-color" content="#101915">
<meta property="og:type" content="website">
<meta property="og:locale" content="sr_ME">
<meta property="og:site_name" content="Pejović apartmani">
<meta property="og:title" content="Galerija fotografija | Pejović apartmani Mojkovac">
<meta property="og:description" content="Fotografije apartmana, kuhinje, spavaće sobe, kupatila i bašte – Pejović apartmani u Mojkovcu, Crna Gora.">
<meta property="og:url" content="https://pejovic-apartmani.github.io/galerija.html">
<meta property="og:image" content="https://pejovic-apartmani.github.io/bedroom.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="geo.region" content="ME-11"><meta name="geo.placename" content="Mojkovac"><meta name="geo.position" content="42.9486263;19.5758832"><meta name="ICBM" content="42.9486263, 19.5758832">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101915'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%23C2A273'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="image" href="bedroom.jpg" fetchpriority="high">

</head>
<body>
<x-dc>
<helmet>
  <title>Galerija fotografija | Pejović apartmani Mojkovac</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter+Tight:wght@400;500;600&amp;display=swap">
  <style>html,body{margin:0;background:#F2EFE8;color:#141B18;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#1F5A50}a:hover{color:#174A42}::selection{background:#C2A273;color:#101915}</style>
  <script src="site.js"></script>
</helmet>
<dc-import name="Nav" page="gallery" hint-size="100%,0px"></dc-import>
<main style="font-family:'Inter Tight',sans-serif;padding:clamp(150px,18vw,220px) clamp(20px,4vw,56px) clamp(100px,12vw,160px)">
  <div style="max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:48px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
      <h1 data-split="" data-hero="" style="margin:0;font:400 clamp(72px,12vw,180px)/.85 'Instrument Serif',serif;letter-spacing:-.03em"><em style="font-style:italic;color:#1F5A50">Galerija</em></h1>
      <div data-reveal=".4" data-hero="" role="tablist" style="display:flex;gap:4px;padding:5px;border-radius:999px;background:#FFFFFF;border:1px solid rgba(0,0,0,.08)">
        <button role="tab" onClick="{{ fAll }}" style="border:0;border-radius:999px;padding:12px clamp(12px,2vw,20px);cursor:pointer;font:500 14px 'Inter Tight',sans-serif;background:{{ bAll }};color:{{ cAll }};transition:background .6s cubic-bezier(.16,1,.3,1)"><span>Sve</span></button>
        <button role="tab" onClick="{{ fIn }}" style="border:0;border-radius:999px;padding:12px 20px;cursor:pointer;font:500 14px 'Inter Tight',sans-serif;background:{{ bIn }};color:{{ cIn }};transition:background .6s cubic-bezier(.16,1,.3,1)"><span>Enterijer</span></button>
        <button role="tab" onClick="{{ fOut }}" style="border:0;border-radius:999px;padding:12px 20px;cursor:pointer;font:500 14px 'Inter Tight',sans-serif;background:{{ bOut }};color:{{ cOut }};transition:background .6s cubic-bezier(.16,1,.3,1)"><span>Eksterijer i bašta</span></button>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:{{ gcols }};grid-auto-rows:{{ grow }};grid-auto-flow:dense;gap:clamp(8px,1.4vw,16px)">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="7">
        <button data-gi="{{ it.id }}" data-cursor="" onClick="{{ it.open }}" aria-label="{{ it.alt }}" style="grid-row:span {{ it.rows }};grid-column:span {{ it.cols }};position:relative;border:0;padding:0;border-radius:24px;overflow:hidden;cursor:pointer;background:#E6E1D6">
          <div data-clip-reveal="" style="position:absolute;inset:0;overflow:hidden">
            <img data-parallax="" src="{{ it.src }}" alt="{{ it.alt }}" loading="lazy" style="position:absolute;left:0;top:-8%;width:100%;height:116%;object-fit:cover">
          </div>
        </button>
      </sc-for>
    </div>
  </div>
</main>
<sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
  <div data-lb="" role="dialog" aria-modal="true" onTouchStart="{{ ts }}" onTouchEnd="{{ te }}" style="position:fixed;inset:0;z-index:300;background:rgba(16,25,21,.96);color:#F2EFE8;display:flex;flex-direction:column;font-family:'Inter Tight',sans-serif">
    <div style="display:flex;justify-content:space-between;align-items:center;padding:20px clamp(20px,4vw,40px)">
      <span style="font:400 28px/1 'Instrument Serif',serif;font-variant-numeric:tabular-nums">{{ counter }}</span>
      <button onClick="{{ close }}" aria-label="Zatvori" style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(242,239,232,.25);background:transparent;color:#F2EFE8;cursor:pointer;font-size:18px">✕</button>
    </div>
    <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 clamp(12px,3vw,32px) 32px">
      <button onClick="{{ prev }}" aria-label="Prethodna" style="flex:none;width:56px;height:56px;border-radius:50%;border:1px solid rgba(242,239,232,.25);background:transparent;color:#F2EFE8;cursor:pointer;font-size:20px">←</button>
      <img data-lb-img="" src="{{ cur.src }}" alt="{{ cur.alt }}" style="max-width:min(100%,1400px);max-height:100%;min-width:0;object-fit:contain;border-radius:18px">
      <button onClick="{{ next }}" aria-label="Sljedeća" style="flex:none;width:56px;height:56px;border-radius:50%;border:1px solid rgba(242,239,232,.25);background:transparent;color:#F2EFE8;cursor:pointer;font-size:20px">→</button>
    </div>
  </div>
</sc-if>
<dc-import name="Footer" hint-size="100%,900px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PHOTOS = [
  { id: 'exterior', src: 'exterior.jpg', cat: 'out', alt: 'Ulaz i bašta', rows: 3, cols: 2 },
  { id: 'living', src: 'living.jpg', cat: 'in', alt: 'Dnevna soba s kuhinjom', rows: 2, cols: 1 },
  { id: 'kitchen', src: 'kitchen.jpg', cat: 'in', alt: 'Kuhinja', rows: 4, cols: 1 },
  { id: 'bedroom', src: 'bedroom.jpg', cat: 'in', alt: 'Spavaća soba', rows: 2, cols: 1 },
  { id: 'house', src: 'house.jpg', cat: 'out', alt: 'Kuća i terasa', rows: 4, cols: 1 },
  { id: 'bathroom', src: 'bathroom.jpg', cat: 'in', alt: 'Kupatilo s tušem', rows: 3, cols: 1 },
  { id: 'entry', src: 'entry.jpg', cat: 'in', alt: 'Privatni ulaz', rows: 4, cols: 1 },
];
class Component extends DCLogic {
  state = { f: 'all', lb: -1, w: window.innerWidth };
  componentDidMount() {
    this.onKey = (e) => { if (this.state.lb < 0) return; if (e.key === 'Escape') this.close(); if (e.key === 'ArrowRight') this.step(1); if (e.key === 'ArrowLeft') this.step(-1); };
    this.onR = () => this.setState({ w: window.innerWidth });
    addEventListener('keydown', this.onKey); addEventListener('resize', this.onR);
  }
  componentWillUnmount() { removeEventListener('keydown', this.onKey); removeEventListener('resize', this.onR); }
  list() { return PHOTOS.filter((p) => this.state.f === 'all' || p.cat === this.state.f); }
  filter(f) {
    if (f === this.state.f) return;
    const F = window.Flip, st = F && !(window.PJ && window.PJ.RM) ? F.getState('[data-gi]') : null;
    this.setState({ f }, () => {
      if (!st) return;
      F.from(st, { duration: 1, ease: 'power3.inOut', absolute: true, nested: true, onEnter: (els) => gsap.fromTo(els, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.9, ease: 'power3.out' }) });
      setTimeout(() => window.ScrollTrigger && ScrollTrigger.refresh(), 1050);
    });
  }
  open(i) { this.setState({ lb: i }, () => { this.pop(); window.PJ && PJ.lenis && PJ.lenis.stop(); }); }
  close() { this.setState({ lb: -1 }); window.PJ && PJ.lenis && PJ.lenis.start(); }
  step(d) { const n = this.list().length; this.setState({ lb: (this.state.lb + d + n) % n }, () => this.pop(d)); }
  pop(d = 0) { const el = document.querySelector('[data-lb-img]'); if (el && window.gsap) gsap.fromTo(el, { opacity: 0, x: d * 40, scale: 0.98 }, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: 'expo.out' }); }
  renderVals() {
    const list = this.list(), f = this.state.f, wide = this.state.w >= 700, i = this.state.lb;
    const on = (k) => (f === k ? '#101915' : 'transparent'), onc = (k) => (f === k ? '#F2EFE8' : '#141B18');
    const pad = (n) => String(n).padStart(2, '0');
    return {
      gcols: wide ? 'repeat(auto-fill,minmax(280px,1fr))' : 'repeat(2,minmax(0,1fr))', grow: wide ? '150px' : '110px',
      items: list.map((p, idx) => ({ ...p, cols: wide ? p.cols : p.id === 'exterior' ? 2 : 1, rows: wide ? p.rows : p.rows >= 3 ? 3 : 2, open: () => this.open(idx) })),
      fAll: () => this.filter('all'), fIn: () => this.filter('in'), fOut: () => this.filter('out'),
      bAll: on('all'), bIn: on('in'), bOut: on('out'), cAll: onc('all'), cIn: onc('in'), cOut: onc('out'),
      lbOpen: i >= 0, cur: list[i] || {}, counter: `${pad(i + 1)} / ${pad(list.length)}`,
      close: () => this.close(), next: () => this.step(1), prev: () => this.step(-1),
      ts: (e) => (this.x0 = e.touches[0].clientX),
      te: (e) => { const dx = e.changedTouches[0].clientX - (this.x0 || 0); if (Math.abs(dx) > 50) this.step(dx < 0 ? 1 : -1); },
    };
  }
}
</script>
</body>
</html>
